<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA - BCA Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav>
    <div class="nav-container">
        <a href="../index.html" class="logo">BCA_PORTAL</a>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="syllabus.html">Syllabus</a>

            <a href="faculty.html">Faculty</a>
            <a href="calculator.html" style="color: var(--accent);">CGPA</a>
            <a href="about.html">About</a>
        </div>
    </div>
    </nav>

    <header class="hero" style="padding: 40px 20px;">
        <h1>Grade Calculator</h1>
    </header>

    <main class="container">
        <div class="card">
            <p style="color: var(--text-dim);">Enter your GPA for each semester (up to 8 semesters).</p>
            
            <div id="semester-list" style="margin: 20px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 20px; border-radius: 8px; margin-bottom: 10px;">
                    <span>Semester 1</span>
                    <input type="number" step="0.01" class="sem-input" placeholder="0.00" 
                           style="background: transparent; border: none; border-bottom: 2px solid #334155; color: var(--accent); text-align: right; font-size: 1.1rem; outline: none; width: 80px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="add-sem-btn" class="btn" style="background: #334155; color: white;">+ Add Sem</button>
                <button id="calc-cgpa-btn" class="btn">Calculate Result</button>
            </div>
        </div>

        <div id="final-result" class="card" style="display: none; text-align: center; border-color: var(--accent);">
            <p style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; margin: 0;">Computed CGPA</p>
            <h2 id="cgpa-val" style="font-size: 3.5rem; margin: 10px 0;">0.00</h2>
        </div>
    </main>

    <script src="../js/main.js"></script>

</body>
</html>
